name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Runner self-hosted na própria VPS — deploy local (sem SSH).
jobs:
  deploy:
    name: Deploy VPS
    runs-on: [self-hosted, linux, x64, prospeccao-prod]
    steps:
      - uses: actions/checkout@v4

      - name: Gate de qualidade (lint + testes API + e2e)
        run: |
          cd sistema/api && npm ci && npx prisma generate && npm test
          cd ../frontend && npm ci && npm run lint && npm run build
          cd ../api && rm -rf public && cp -R ../frontend/dist public
          cd ../frontend && npx playwright install --with-deps chromium && npm run test:e2e
        env:
          CI: 'true'

      - name: Build landing
        working-directory: landing
        run: npm ci && npm run build

      - name: Build sistema (admin + API public)
        run: |
          cd sistema/frontend && npm ci && npm run build
          cd ../api && npm ci && npx prisma generate
          rm -rf public && cp -R ../frontend/dist public

      - name: Publicar landing
        run: |
          sudo rsync -az --delete landing/dist/ /var/www/prospeccaobrasil-landing/
          sudo chown -R www-data:www-data /var/www/prospeccaobrasil-landing || true

      - name: Publicar sistema
        run: |
          sudo rsync -az \
            --exclude node_modules \
            --exclude .env \
            --exclude 'prisma/*.db*' \
            --exclude 'uploads/*' \
            --exclude .browsers \
            sistema/api/ /opt/prospeccao-sistema/
          cd /opt/prospeccao-sistema
          # Snapshot do banco antes da migration — rollback: parar serviço, restaurar cp, restart
          sudo mkdir -p backups
          sudo node -e "const{DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('prisma/prospeccao.db');d.exec('PRAGMA wal_checkpoint(TRUNCATE)');d.close()" 2>/dev/null || true
          sudo cp prisma/prospeccao.db backups/prospeccao-$(date +%Y%m%d%H%M%S).db
          sudo bash -c 'ls -t backups/*.db | tail -n +16 | xargs -r rm --'
          sudo npm install --omit=dev
          # Chromium para o PDF da apresentação (A4 exato); as dependências do sistema já vêm do gate de e2e
          sudo PLAYWRIGHT_BROWSERS_PATH=/opt/prospeccao-sistema/.browsers npx playwright-core install chromium
          sudo chmod -R a+rX /opt/prospeccao-sistema/.browsers
          sudo npx prisma generate
          sudo npx prisma migrate deploy
          # Backup diário do banco (30 cópias; envia para fora da VPS se BACKUP_REMOTE estiver no .env)
          echo '15 3 * * * root /opt/prospeccao-sistema/scripts/backup.sh >> /var/log/prospeccao-backup.log 2>&1' | sudo tee /etc/cron.d/prospeccao-backup >/dev/null
          sudo chmod 644 /etc/cron.d/prospeccao-backup
          sudo systemctl restart prospeccao-sistema
          sleep 2
          curl -sf http://127.0.0.1:8090/api/healthz

      - name: Smoke checks
        run: |
          curl -sfI https://prospeccaobrasil.com.br/ | head -5
          curl -sf https://sistema.prospeccaobrasil.com.br/api/healthz
