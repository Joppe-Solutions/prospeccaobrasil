name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-landing:
    name: Build landing
    runs-on: [self-hosted, linux, x64, prospeccao-prod]
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e buildar
        run: |
          npm ci
          npm run build

  build-sistema:
    name: Build sistema (API + admin)
    runs-on: [self-hosted, linux, x64, prospeccao-prod]
    steps:
      - uses: actions/checkout@v4
      - name: Prisma generate
        working-directory: sistema/api
        run: |
          npm ci
          npx prisma generate
      - name: Build admin
        working-directory: sistema/frontend
        run: |
          npm ci
          npm run build
      - name: Embutir SPA em api/public
        run: |
          rm -rf sistema/api/public
          cp -R sistema/frontend/dist sistema/api/public
