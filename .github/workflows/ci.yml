name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI roda em runner hospedado (ubuntu-latest) — isolado do host de produção.
# O runner self-hosted (prospeccao-prod) é reservado ao deploy.yml (fluxo protegido em main).
jobs:
  build-landing:
    name: Build landing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e buildar
        run: |
          npm ci
          npm run build

  build-sistema:
    name: Build sistema (API + admin)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prisma generate
        working-directory: sistema/api
        run: |
          npm ci
          npx prisma generate
      - name: Lint admin
        working-directory: sistema/frontend
        run: |
          npm ci
          npm run lint
      - name: Build admin
        working-directory: sistema/frontend
        run: npm run build
      - name: Embutir SPA em api/public
        run: |
          rm -rf sistema/api/public
          cp -R sistema/frontend/dist sistema/api/public

  test-api:
    name: Testes da API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e gerar Prisma
        run: |
          npm ci
          npx prisma generate
      - name: Rodar testes
        run: npm test

  test-e2e:
    name: E2E (Playwright)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build admin e embutir em api/public
        run: |
          cd sistema/frontend && npm ci && npm run build
          cd ../api && npm ci && npx prisma generate
          rm -rf public && cp -R ../frontend/dist public
      - name: Playwright chromium
        working-directory: sistema/frontend
        run: npx playwright install --with-deps chromium
      - name: Rodar e2e
        working-directory: sistema/frontend
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Relatório Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sistema/frontend/playwright-report
          retention-days: 7
